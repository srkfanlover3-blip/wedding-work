    const IconClock = ({ className = "w-4 h-4" }) => (

    const IconSparkles = ({ className = "w-4 h-4" }) => (

    // --- Falling Petals Component ---
    const FallingPetals = ({ enabled = true }) => {
      const petals = useMemo(() => {
        return Array.from({ length: 20 }).map((_, i) => ({
          id: i,
          left: `${Math.floor(Math.random() * 95) + 2}%`,
          delay: `${(Math.random() * 8).toFixed(1)}s`,
          duration: `${(10 + Math.random() * 8).toFixed(1)}s`,
          size: 16 + Math.random() * 12,
          isRose: i % 3 !== 0,
        }));
      }, []);

      if (!enabled) return null;

      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden z-20">
          {petals.map((p) => (
            <div
              key={p.id}
              style={{
                position: 'fixed',

                left: p.left,
                animation: `petalFall ${p.duration} linear ${p.delay} infinite`,
              }}
            >

                  d="M15 0 C25 8, 30 22, 22 35 C15 42, 6 36, 3 28 C-1 18, 5 6, 15 0 Z"

                />

            </div>
          ))}
        </div>
      );
    };

    // --- Ambient Music Player (Synthesized Flute / Shehnai) ---
    const MusicPlayer = () => {
      const [isPlaying, setIsPlaying] = useState(false);
      const audioCtxRef = useRef(null);
      const intervalRef = useRef(null);
      const gainNodeRef = useRef(null);

      const notes = [261.63, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 523.25];
      const melody = [0, 2, 4, 3, 2, 4, 6, 7, 6, 4, 2, 0, 4, 6, 7, 6, 7, 4, 2, 0, 2, 4, 2, 0];

      const playNote = (freq, duration = 1.2) => {
        if (!audioCtxRef.current) return;
        const ctx = audioCtxRef.current;
        const osc = ctx.createOscillator();
        const noteGain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        noteGain.gain.setValueAtTime(0.001, ctx.currentTime);
        noteGain.gain.exponentialRampToValueAtTime(0.07, ctx.currentTime + 0.2);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

        osc.connect(noteGain);
        noteGain.connect(gainNodeRef.current);

        osc.start();
        osc.stop(ctx.currentTime + duration);
      };

      const startMusic = () => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!audioCtxRef.current) {
            audioCtxRef.current = new AudioContext();
            gainNodeRef.current = audioCtxRef.current.createGain();
            gainNodeRef.current.gain.value = 0.5;
            gainNodeRef.current.connect(audioCtxRef.current.destination);
          }
          if (audioCtxRef.current.state === 'suspended') {
            audioCtxRef.current.resume();
          }

          let noteIdx = 0;
          playNote(130.81, 4.0);

          intervalRef.current = setInterval(() => {
            const noteIndexInScale = melody[noteIdx % melody.length];
            playNote(notes[noteIndexInScale], 1.6);
            if (noteIdx % 4 === 0) playNote(130.81, 3.0);
            noteIdx++;
          }, 700);

          setIsPlaying(true);
        } catch (e) {
          console.warn('Audio autoplay prevented:', e);
        }
      };

      const stopMusic = () => {
        if (intervalRef.current) {
          clearInterval(intervalRef.current);
          intervalRef.current = null;
        }
        if (audioCtxRef.current && audioCtxRef.current.state === 'running') {
          audioCtxRef.current.suspend();
        }
        setIsPlaying(false);
      };

      return (
        <div className="fixed bottom-6 right-6 z-40">
          <button
            onClick={() => isPlaying ? stopMusic() : startMusic()}
            type="button"
            className="flex items-center gap-2.5 px-4 py-2.5 rounded-full bg-cream-50/95 backdrop-blur-md border border-gold-400 shadow-lg text-maroon-800 hover:scale-105 active:scale-95 transition-all"
          >
            {isPlaying ? <IconVolume2 className="w-4 h-4 text-gold-600 animate-pulse" /> : <IconVolumeX className="w-4 h-4 text-maroon-700/60" />}
            <span className="text-xs font-serif font-bold text-maroon-900 flex items-center gap-1.5 uppercase tracking-wider">
              <IconMusic className="w-3.5 h-3.5 text-gold-600" />
              {isPlaying ? "Music On" : "Wedding Tune"}
            </span>
          </button>
        </div>
      );
    };

    // --- Section 1: Splash Screen (Envelope Reveal) ---
    const SplashScreen = ({ onOpen, isOpen }) => {
      const [opening, setOpening] = useState(false);

      const handleReveal = () => {
        if (opening) return;
        setOpening(true);

        if (window.confetti) {
          window.confetti({
            particleCount: 80,
            spread: 90,
            origin: { y: 0.6 },
            colors: ['#C09325', '#E4C779', '#991B2D', '#F4CBD1', '#FAF6EF'],

        }

        setTimeout(() => {
          onOpen();
        }, 1600);
      };

      if (isOpen) return null;

      return (
        <div className={`fixed inset-0 z-50 flex items-center justify-center bg-[#2B070D]/95 backdrop-blur-md p-4 transition-all duration-700 ${opening ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
          <div className="relative w-full max-w-md sm:max-w-lg aspect-[1.35/1] flex items-center justify-center">
            
            {/* Envelope Box */}
            <div className="relative w-full h-full bg-[#FAF5EC] rounded-2xl shadow-2xl border-2 border-gold-300 overflow-hidden flex flex-col items-center justify-between p-6 sm:p-8">
              
              <OrnateCorner position="top-left" className="absolute top-2 left-2 w-12 h-12 text-gold-500 opacity-80" />
              <OrnateCorner position="top-right" className="absolute top-2 right-2 w-12 h-12 text-gold-500 opacity-80" />
              <OrnateCorner position="bottom-left" className="absolute bottom-2 left-2 w-12 h-12 text-gold-500 opacity-80" />

                    </h3>
                    <p className="font-serif text-base font-bold text-maroon-800 mt-0.5">
                      {event.ceremony}
                    </p>
                  </div>
                  {event.dressCode && (
                    <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold ${event.badgeClass}`}>
                      Dress Code: {event.dressCode}
                    </span>
                  )}
                </div>

                <p className="text-xs sm:text-sm text-maroon-900/80 leading-relaxed font-sans mb-4">
                  {event.description}
                </p>

                <div className="flex flex-wrap items-center gap-4 text-xs font-medium text-maroon-900 bg-white/70 p-3 rounded-xl border border-stone-200">
                  <div className="flex items-center gap-1.5">
                    <IconCalendar className="w-4 h-4 text-gold-600" />
                    <span>{event.date}</span>
                  </div>
                  <span>•</span>
                  <div className="flex items-center gap-1.5">
                    <IconMapPin className="w-4 h-4 text-gold-600" />
                    <span>{event.venue}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    };

    // --- Section 5: Interactive RSVP Form ---
    const RsvpSection = () => {
      const [formData, setFormData] = useState({
        fullName: '',
        phone: '',
        attendance: 'accept',
        events: ['both'],
        emotionalGuess: 'Both',
        weddingMood: 'All of it',
        note: '',
        advice: '',
      });
      const [submitted, setSubmitted] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const moods = ['The Food', 'Dance Floor', 'The Love', 'All of it'];

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.fullName.trim()) {
          setErrorMsg('Please enter your full name');
          return;
        }
        if (!formData.phone.trim() || formData.phone.length < 8) {
          setErrorMsg('Please enter a valid phone number');
          return;
        }
        setErrorMsg('');
        setSubmitted(true);

        if (window.confetti) {
          window.confetti({
            particleCount: 90,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#C09325', '#991B2D', '#F4CBD1', '#166534'],
          });
        }
      };

      return (
        <section id="rsvp" className="relative py-20 px-4 max-w-3xl mx-auto">
          <div className="text-center mb-12">
            <span className="text-xs uppercase tracking-[0.3em] text-gold-700 font-semibold">
              Your Presence Is Our Blessing
            </span>
            <h2 className="font-serif text-3xl sm:text-5xl text-maroon-900 font-semibold mt-1">
              Celebrate With Us (RSVP)
            </h2>
            <OrnateDivider className="my-4" />
          </div>

          <div className="bg-cream-50/95 rounded-3xl border-2 border-gold-300 shadow-2xl p-6 sm:p-10 relative">
            <OrnateCorner position="top-left" className="absolute top-2 left-2 w-10 h-10 text-gold-400 opacity-80" />
            <OrnateCorner position="top-right" className="absolute top-2 right-2 w-10 h-10 text-gold-400 opacity-80" />

            {!submitted ? (
              <form onSubmit={handleSubmit} className="space-y-6">
                
                {/* Two large toggle buttons */}
                <div>
                  <label className="block text-xs font-serif font-bold uppercase tracking-wider text-gold-800 mb-3 text-center">
                    Will You Be Joining Our Celebrations?
                  </label>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button
                      type="button"
                      onClick={() => setFormData({ ...formData, attendance: 'accept' })}
                      className={`p-4 rounded-2xl border-2 flex items-center justify-center gap-3 transition-all ${formData.attendance === 'accept' ? 'border-emerald-600 bg-emerald-50 text-emerald-900 font-bold shadow-md' : 'border-stone-200 bg-white/70 text-stone-600'}`}
                    >
                      <IconCheck className="w-5 h-5 text-emerald-600" />
                      <span className="font-serif text-base">Joyfully Accept</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => setFormData({ ...formData, attendance: 'decline' })}
                      className={`p-4 rounded-2xl border-2 flex items-center justify-center gap-3 transition-all ${formData.attendance === 'decline' ? 'border-maroon-700 bg-maroon-50 text-maroon-900 font-bold shadow-md' : 'border-stone-200 bg-white/70 text-stone-600'}`}
                    >
                      <IconHeart className="w-5 h-5 text-maroon-600" />
                      <span className="font-serif text-base">Regrettably Decline</span>
                    </button>
                  </div>
                </div>

                {/* Name & Phone */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                  <div>
                    <label className="block text-xs font-serif font-bold uppercase tracking-wider text-maroon-900 mb-2">
                      Full Name *
                    </label>
                    <input
                      type="text"
                      required
                      value={formData.fullName}
                      onChange={(e) => setFormData({ ...formData, fullName: e.target.value })}
                      placeholder="e.g. Ramesh & Sunita Verma"
                      className="w-full px-4 py-3 rounded-xl bg-white border border-gold-300 focus:border-gold-600 outline-none text-sm text-maroon-900"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-serif font-bold uppercase tracking-wider text-maroon-900 mb-2">
                      Phone Number *
                    </label>
                    <input
                      type="tel"
                      required
                      value={formData.phone}
                      onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                      placeholder="+91 98765 43210"
                      className="w-full px-4 py-3 rounded-xl bg-white border border-gold-300 focus:border-gold-600 outline-none text-sm text-maroon-900"
                    />
                  </div>
                </div>

                {/* Event selection checkboxes */}
                <div>
                  <label className="block text-xs font-serif font-bold uppercase tracking-wider text-maroon-900 mb-2">
                    Event Selection
                  </label>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    {[
                      { id: 'day1', label: 'Day 1' },
                      { id: 'day2', label: 'Day 2' },
                      { id: 'both', label: 'Both Days' },
                    ].map((ev) => (
                      <label key={ev.id} className="flex items-center gap-2 p-3 rounded-xl border border-gold-300 bg-white/80 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={formData.events.includes(ev.id)}
                          onChange={() => {
                            let curr = [...formData.events];
                            if (curr.includes(ev.id)) curr = curr.filter(x => x !== ev.id);
                            else curr.push(ev.id);
                            setFormData({ ...formData, events: curr });
                          }}
                          className="accent-gold-600 w-4 h-4"
                        />
                        <span className="font-serif text-sm font-bold text-maroon-900">{ev.label}</span>
                      </label>
                    ))}
                  </div>
                </div>

                {/* Make a Guess poll */}
                <div className="bg-cream-100/90 rounded-2xl p-4 border border-gold-300">
                  <label className="block text-xs font-serif font-bold uppercase tracking-wider text-maroon-900 mb-2">
                    Make a Guess: Who will get emotional first? 🥺
                  </label>
                  <div className="grid grid-cols-3 gap-2">
                    {['Lokesh', 'Komal', 'Both'].map((opt) => (
                      <label key={opt} className={`flex items-center justify-center gap-1.5 p-2.5 rounded-xl border-2 cursor-pointer text-xs font-serif font-bold ${formData.emotionalGuess === opt ? 'border-maroon-700 bg-maroon-50 text-maroon-900' : 'border-stone-200 bg-white text-stone-700'}`}>
                        <input
                          type="radio"
                          name="guess"
                          checked={formData.emotionalGuess === opt}
                          onChange={() => setFormData({ ...formData, emotionalGuess: opt })}
                          className="accent-maroon-700"
                        />
                        <span>{opt}</span>
                      </label>
                    ))}
                  </div>
                </div>

                {/* Mood Tag Selector */}
                <div>
                  <label className="block text-xs font-serif font-bold uppercase tracking-wider text-maroon-900 mb-2">
                    Your Wedding Mood
                  </label>
                  <div className="flex flex-wrap gap-2">
                    {moods.map((m) => (
                      <button
                        key={m}
                        type="button"
                        onClick={() => setFormData({ ...formData, weddingMood: m })}
                        className={`px-4 py-2 rounded-full border text-xs font-serif font-semibold transition-all ${formData.weddingMood === m ? 'bg-gold-500 text-maroon-950 border-gold-600 shadow-sm font-bold' : 'bg-white border-gold-300 text-maroon-800'}`}
                      >
                        {m}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Notes & Advice */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-serif font-bold uppercase tracking-wider text-maroon-900 mb-1">
                      Leave Us a Note
                    </label>
                    <textarea
                      rows={3}
                      value={formData.note}
                      onChange={(e) => setFormData({ ...formData, note: e.target.value })}
                      placeholder="Can't wait to dance! Any message for couple..."
                      className="w-full px-3 py-2.5 rounded-xl bg-white border border-gold-300 text-xs text-maroon-900 outline-none resize-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-serif font-bold uppercase tracking-wider text-maroon-900 mb-1">
                      Words for Forever (Advice)
                    </label>
                    <textarea
                      rows={3}
                      value={formData.advice}
                      onChange={(e) => setFormData({ ...formData, advice: e.target.value })}
                      placeholder="Your secret to a happy lifelong marriage..."
                      className="w-full px-3 py-2.5 rounded-xl bg-white border border-gold-300 text-xs text-maroon-900 outline-none resize-none"
                    />
                  </div>
                </div>

                {errorMsg && (
                  <p className="text-xs text-rose-700 text-center font-bold">{errorMsg}</p>
                )}

                {/* Large submit button: "Send Love" */}
                <div className="text-center pt-2">
                  <button
                    type="submit"
                    className="w-full sm:w-auto min-w-[260px] px-8 py-3.5 rounded-2xl bg-gradient-to-r from-maroon-800 to-maroon-900 hover:from-maroon-900 hover:to-maroon-950 text-gold-200 font-serif font-bold text-base tracking-wider uppercase shadow-xl transition-all border border-gold-400"
                  >
                    Send Love 💖
                  </button>
                </div>

              </form>
            ) : (
              <div className="text-center py-8 space-y-4">
                <div className="w-16 h-16 rounded-full bg-emerald-100 border border-emerald-400 text-emerald-700 flex items-center justify-center mx-auto">
                  <IconCheck className="w-8 h-8" />
                </div>
                <h3 className="font-alex text-4xl text-maroon-900">
                  Thank You, {formData.fullName}!
                </h3>
                <p className="font-serif text-sm text-maroon-800 max-w-md mx-auto">
                  {formData.attendance === 'accept'
                    ? "We are thrilled that you will be sharing in our laughter, dance, and prayers at Tivoli Lotus Court!"
                    : "We will miss having you in person, but your love and blessings mean everything to us."}
                </p>
                <button
                  onClick={() => setSubmitted(false)}
                  className="px-5 py-2 rounded-full bg-cream-200 border border-gold-400 text-maroon-900 text-xs font-serif font-bold uppercase tracking-wider"
                >
                  Edit Response
                </button>
              </div>
            )}

          </div>
        </section>
      );
    };

    // --- Section 6: Footer Section ---
    const FooterSection = ({ onReopenEnvelope }) => {
      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

      return (
        <footer className="relative bg-gradient-to-b from-[#4A0E17] via-[#3B0811] to-[#25040A] text-gold-200 pt-16 pb-12 px-4 border-t-2 border-gold-400">
          <div className="max-w-4xl mx-auto text-center">
            
            {/* Large Cursive Heading */}
            <h2 className="font-alex text-6xl sm:text-8xl text-gold-300 drop-shadow mb-2">
              Lokesh & Komal
            </h2>
            <p className="font-serif italic text-sm text-gold-200/80 max-w-md mx-auto">
              "Two souls, two families, one eternal journey of love and togetherness."
            </p>

            <OrnateDivider className="my-8 opacity-60" />

            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 my-10 text-left">
              {/* With Compliments From */}
              <div className="bg-maroon-950/60 rounded-3xl p-6 border border-gold-500/40">
                <h3 className="font-serif text-xl font-bold text-gold-300 text-center mb-4">
                  With Compliments From
                </h3>
                <div className="space-y-3 font-serif text-xs text-gold-100 text-center leading-relaxed">
                  <p className="font-bold text-sm text-gold-200">Prasad & Sharma Families</p>
                  <p>Grandparents: Smt. & Shri R. K. Prasad • Smt. & Shri M. L. Sharma</p>
                  <p>Chacha - Chachi, Mama - Mami, Bua - Fufa</p>
                  <p>Brothers, Sisters, Cousins, and near & dear ones</p>
                </div>
              </div>

              {/* RSVP & Contacts */}
              <div className="bg-maroon-950/60 rounded-3xl p-6 border border-gold-500/40">
                <h3 className="font-serif text-xl font-bold text-gold-300 text-center mb-4">
                  RSVP & Contact Details
                </h3>
                <div className="space-y-3">
                  {[
                    { name: 'Shri Rajendra Prasad', rel: "Groom's Father", phone: '+91 98765 43210', wa: '919876543210' },
                    { name: 'Shri Suresh Sharma', rel: "Bride's Father", phone: '+91 98123 45678', wa: '919812345678' },
                  ].map((c, i) => (
                    <div key={i} className="bg-maroon-900/60 rounded-xl p-3 border border-gold-500/30 flex items-center justify-between">
                      <div>
                        <p className="font-serif text-sm font-bold text-gold-100">{c.name}</p>
                        <p className="text-[11px] text-gold-300/70">{c.rel}</p>
                      </div>
                      <div className="flex gap-2">
                        <a href={`tel:${c.phone.replace(/\s+/g, '')}`} className="px-3 py-1 rounded-full bg-gold-500/20 text-gold-200 text-xs font-bold border border-gold-400 flex items-center gap-1">
                          <IconPhone className="w-3 h-3" /> Call
                        </a>
                        <a href={`https://wa.me/${c.wa}`} target="_blank" rel="noopener noreferrer" className="px-3 py-1 rounded-full bg-emerald-600/30 text-emerald-200 text-xs font-bold border border-emerald-400 flex items-center gap-1">
                          <IconMessageSquare className="w-3 h-3" /> WhatsApp
                        </a>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="mt-4 text-center">
                  <button onClick={onReopenEnvelope} className="text-xs text-gold-300 hover:underline font-serif">
                    Re-open Invitation Envelope ✉️
                  </button>
                </div>
              </div>
            </div>

            {/* Ayyu & Advait Note */}
            <div className="my-8 max-w-lg mx-auto bg-gold-900/40 rounded-2xl p-4 border-2 border-dashed border-gold-400 text-center">
              <p className="font-alex text-2xl sm:text-3xl text-gold-300 font-bold">
                "Mere Chacha ki shaadi mein jalool jalool aana!"
              </p>
              <p className="font-serif text-xs text-gold-200/90 font-semibold tracking-wider uppercase mt-1">
                — Ayyu & Advait ❤️
              </p>
            </div>

            {/* Copyright & Date/Venue Summary */}
            <div className="pt-6 border-t border-gold-500/20 text-xs font-serif text-gold-300/80 space-y-2">
              <p>19th & 27 - 29 April 2026 • Tivoli Lotus Court, Sector 117 Main Rd, Noida</p>
              <p className="text-[11px] text-gold-400/60 font-sans">
                © 2026 Lokesh & Komal. Designed with love and devotion.
              </p>
              <button onClick={scrollToTop} className="mt-2 inline-block px-4 py-1.5 rounded-full bg-gold-400/10 border border-gold-400/30 text-gold-300 text-xs">
                Back to Top ↑
              </button>
            </div>

          </div>
        </footer>
      );
    };

    // --- Main App Component ---
    function App() {
      const [envelopeOpened, setEnvelopeOpened] = useState(false);
      const [petalsEnabled, setPetalsEnabled] = useState(true);

      return (
        <div className="min-h-screen bg-[#FAF6EF] text-[#480B16] font-sans relative selection:bg-gold-300 selection:text-maroon-900">
          
          {/* Section 1: Splash Screen Envelope */}
          <SplashScreen
            isOpen={envelopeOpened}
            onOpen={() => setEnvelopeOpened(true)}
          />

          {/* Falling Petals Background */}
          <FallingPetals enabled={petalsEnabled} />

          {/* Ambient Music Player */}
          <MusicPlayer />

          {/* Sticky Header Nav */}
          <header className="fixed top-0 inset-x-0 z-40 px-4 py-3">
            <div className="max-w-4xl mx-auto rounded-full bg-cream-50/85 backdrop-blur-md border border-gold-300 shadow-sm px-4 py-2 flex items-center justify-between">
              <a href="#blessings" className="font-alex text-2xl sm:text-3xl text-maroon-900">
                Lokesh & Komal
              </a>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setPetalsEnabled(!petalsEnabled)}
                  className="px-2.5 py-1 rounded-full border border-gold-300 text-xs font-serif text-maroon-900 bg-cream-100"
                >
                  {petalsEnabled ? '🌸 Petals On' : '🌸 Petals Off'}
                </button>
                <button
                  onClick={() => setEnvelopeOpened(false)}
                  className="px-3 py-1 rounded-full bg-gold-500 text-maroon-950 text-xs font-serif font-bold shadow-xs"
                >
                  Envelope ✉️
                </button>
              </div>
            </div>
          </header>

          {/* Main Sections */}
          <main className="pt-16">
            <HeroSection />
            <MomentsAndVenue />
            <Itinerary />
            <RsvpSection />
          </main>

          {/* Section 6: Footer */}
          <FooterSection onReopenEnvelope={() => setEnvelopeOpened(false)} />

        </div>
      );
    }

    // 4. Correct Rendering at end of script tag
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
